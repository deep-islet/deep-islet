<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ds</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 50% 76%,#1d2836 0%,#0a0f15 72%);}
#stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:8vh;}
/* 固定盒子：换姿势时元素尺寸恒定，不重排 */
#box{height:min(44vh,340px);width:min(88vw,420px);
  display:flex;align-items:flex-end;justify-content:center;overflow:visible;}
#wrap{transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite;}
#float{animation:float 6s ease-in-out infinite;}
/* 画布 420x420，用 background 承载，方便接精灵条 */
#pet{width:420px;height:420px;flex:0 0 auto;transform-origin:50% 100%;
  background-repeat:no-repeat;background-position:center bottom;background-size:420px 420px;
  image-rendering:pixelated;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));}
/* 走路：两帧精灵条 840x420，steps(2) 硬切 */
#pet.walk{animation:walkstep .56s steps(2) infinite;}
@keyframes walkstep{from{background-position:0 bottom}to{background-position:-840px bottom}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.02)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#wrap.boing{animation:boing .44s cubic-bezier(.3,1.6,.5,1);}
@keyframes boing{0%{transform:scale(1,1)}35%{transform:scale(1.07,.93)}
  70%{transform:scale(.97,1.05)}100%{transform:scale(1,1)}}
#say{position:fixed;left:0;right:0;bottom:calc(8vh + min(44vh,340px) + 8px);
  text-align:center;color:#cfe3f5;font:15px/1.6 system-ui,-apple-system,sans-serif;
  opacity:0;transition:opacity .25s;padding:0 24px;pointer-events:none;}
#say.on{opacity:1;}
#tip{position:fixed;left:0;right:0;bottom:2.2vh;text-align:center;
  color:#5b7185;font:12px/1.4 system-ui,-apple-system,sans-serif;pointer-events:none;}
/* w=1：塞进桌面小组件用的模式，透明底、去掉文字提示、居中 */
html.w,html.w body{background:transparent;}
html.w #pet{filter:none;}
html.w #stage{padding-bottom:0;align-items:center;}
html.w #say,html.w #tip{display:none;}
html.w #box{height:min(56vw,210px);width:auto;}
</style>
<script>
if (location.search.indexOf('w=1') >= 0) document.documentElement.classList.add('w');
</script>
</head>

  <div id="box"><div id="wrap"><div id="float"><div id="pet"></div></div></div></div>
</div>

function fit(){
  const k = Math.min(box.clientHeight / 420, box.clientWidth / 420);
  pet.style.transform = 'scale(' + k + ')';
}
window.addEventListener('resize', fit);

function talk(t){
  say.textContent = t;
  say.classList.add('on');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => say.classList.remove('on'), 2200);
}
function boing(){
  wrap.classList.remove('boing');
  void wrap.offsetWidth;
  wrap.classList.add('boing');
}

/* 走路用精灵条 + steps 硬切；其它姿势是单张静帧。尺寸一律写 inline，避免被类覆盖 */
function applyPose(p){
  pose = p;
  pet.classList.remove('walk');
  pet.style.animation = '';
  if (p === 'walk') {
    pet.style.backgroundSize = '840px 420px';
    pet.style.backgroundImage = 'url(' + SPRITE + ')';
    pet.classList.add('walk');
  } else {
    pet.style.backgroundSize = '420px 420px';
    pet.style.backgroundImage = 'url(' + SRC[p] + ')';
  }
}

/* 常驻姿势不动，偶尔自己眨一下或走两步（只在站着的时候） */
function autoBlink(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (pose === 'stand') {
      pet.style.backgroundImage = 'url(' + SRC.blink + ')';
      setTimeout(() => { if (pose === 'stand') pet.style.backgroundImage = 'url(' + SRC.stand + ')'; }, 420);
    }
    autoBlink();
  }, 7000 + Math.random() * 9000);
}

document.addEventListener('click', () => {
  idx = (idx + 1) % ORDER.length;
  applyPose(ORDER[idx]);
  boing();
  talk(SAYS[ORDER[idx]]);
  tip.style.opacity = 0;
});

fit();
applyPose('stand');
autoBlink();
</script>
</body>
</html>
